services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: movieai
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://movie:movie@postgres:5432/movieai
      FRONTEND_ORIGIN: http://localhost:3000
      COMFYUI_URL: http://host.docker.internal:8188
      # Pass real keys through from your shell / .env. Set USE_MOCK_AI=true to
      # run without credentials (deterministic placeholder output).
      USE_MOCK_AI: "${USE_MOCK_AI:-false}"
      DEFAULT_LLM_PROVIDER: "${DEFAULT_LLM_PROVIDER:-openai}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-4.1}"
      OPENAI_IMAGE_MODEL: "${OPENAI_IMAGE_MODEL:-gpt-image-1}"
      API_TOKEN: change-me
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - qdrant
      - minio

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  qdrant-data:
  minio-data:
